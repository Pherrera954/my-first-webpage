<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Contact</title>
</head>

<body>
    <header>
        <h1>Contact North Star Bakery</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Place an Inquiry or Pre-Order</h2>

            <form>
                <fieldset>
                    <legend>Bakery Request</legend>

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <br>

                    <label for="pickup">Pickup Date:</label>
                    <input type="date" id="pickup" name="pickup" required>

                    <br>

                    <label for="request">Request Type:</label>
                    <select id="request" name="request" required>
                        <option value="">Select one</option>
                        <option value="preorder">Pre-Order</option>
                        <option value="question">General Question</option>
                    </select>

                    <br>

                    <label for="details">Item Details:</label>
                    <textarea id="details" name="details" required></textarea>

                    <br>

                    <label for="allergy">Allergy Notes:</label>
                    <textarea id="allergy" name="allergy"></textarea>

                    <br>

                    <button type="submit">Submit Request</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>Location</h2>
            <p>Visit North Star Bakery in our local neighborhood.</p>
        </section>

        <section>
            <h2>Hours</h2>
            <p>Monday-Saturday: 7:00 AM-6:00 PM</p>
            <p>Sunday: 8:00 AM-2:00 PM</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>
</body>
</html>
